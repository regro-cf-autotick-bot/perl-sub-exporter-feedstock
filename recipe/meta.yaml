{% set name = "perl-sub-exporter" %}
{% set version = "0.992" %}
{% set sha256 = "31d1b7016390528f3ed2cda379f4026a4e7fbad2aa40c8c9a1808961bf642c67" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/R/RJ/RJBS/Sub-Exporter-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  skip: true  # [win]
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor
    - make
    - make test     # [build_platform == target_platform]
    - make install
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-params-util
    - perl-sub-install
    - perl-data-optlist
  run:
    - perl
    - perl-sub-install  # has no run export

test:
  imports:
    - Sub::Exporter
    - Sub::Exporter::Util

about:
  home: https://github.com/rjbs/Sub-Exporter
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - {{ environ["PREFIX"] }}/man/man1/perlartistic.1
    - {{ environ["PREFIX"] }}/man/man1/perlgpl.1
  summary: a sophisticated exporter for custom-built routines

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
